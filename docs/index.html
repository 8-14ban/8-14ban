    <script>
    (function(){
      if(window.__NS) return;
      function prep(img){
        if(img.hasAttribute('loading')||img.dataset.ld) return;
        img.dataset.ld='1';
        img.setAttribute('loading','lazy');
        img.setAttribute('decoding','async');
      }
      new MutationObserver(function(muts){
        for(const m of muts){
          for(const n of m.addedNodes){
            if(n.nodeType!==1) continue;
            if(n.tagName==='IMG') prep(n);
            else if(n.querySelectorAll) n.querySelectorAll('img').forEach(prep);
          }
        }
      }).observe(document.documentElement,{childList:true,subtree:true});
    })();

    <div id="app"></div>
    <script>
    if(!window.__NS){
      var SG=[{n:'心似烟火',s:'心似烟火.mp3'},{n:'星茶会',s:'星茶会.mp3'},{n:'风摇盛夏',s:'风摇盛夏.mp3'},{n:'3:30PM',s:'3_30PM.mp3'}];
      var ci=0,au=new Audio();au.preload='auto';
      var I={play:'<svg viewBox="0 0 24 24" width="15" height="15"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>',pause:'<svg viewBox="0 0 24 24" width="15" height="15"><path d="M6 5h4v14H6zm8 0h4v14h-4z" fill="currentColor"/></svg>',next:'<svg viewBox="0 0 24 24" width="13" height="13"><path d="M6 6h2v12H6zm3.5 6L18 18V6z" fill="currentColor"/></svg>',prev:'<svg viewBox="0 0 24 24" width="13" height="13"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" fill="currentColor"/></svg>',fold:'<svg viewBox="0 0 24 24" width="13" height="13"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" fill="currentColor"/></svg>',note:'<svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3z" fill="currentColor"/></svg>'};
      var css='#mp{position:fixed;right:16px;bottom:16px;z-index:99998;font-family:Georgia,serif;user-select:none}';

      css+='@keyframes mpp{0%{box-shadow:0 0 0 0 rgba(178,58,46,.45)}100%{box-shadow:0 0 0 12px rgba(178,58,46,0)}}';

      css+='.mp-btn.big:hover{background:#9c4535}';
      css+=' .hide{display:none!important}';
      var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
      var mp=document.createElement('div');mp.id='mp';
      mp.innerHTML='<button class="mp-mini"></button><div class="mp-box hide"><span class="mp-name"></span><div class="mp-prog"><div class="mp-bar"></div></div><button class="mp-btn mp-prev"></button><button class="mp-btn big mp-play"></button><button class="mp-btn mp-next"></button><button class="mp-btn mp-fold"></button></div>';
      document.body.appendChild(mp);
      var mini=mp.querySelector('.mp-mini'),box=mp.querySelector('.mp-box'),nmEl=mp.querySelector('.mp-name'),pbEl=mp.querySelector('.mp-bar'),playEl=mp.querySelector('.mp-play'),prevEl=mp.querySelector('.mp-prev'),nextEl=mp.querySelector('.mp-next'),foldEl=mp.querySelector('.mp-fold');

      function load(){au.src='/music/'+encodeURIComponent(SG[ci].s);nmEl.textContent=SG[ci].n;}
      function next(){ci=(ci+1)%SG.length;load();au.play();}
      function prev(){ci=(ci-1+SG.length)%SG.length;load();au.play();}
      mini.addEventListener('click',function(){box.classList.remove('hide');mini.classList.add('hide');un();});

      au.addEventListener('playing',syncIcon);
      load();syncIcon();
      var un=function(){if(au.muted)au.muted=false;if(au.paused)au.play();document.removeEventListener('pointerdown',un);document.removeEventListener('touchstart',un);};
      var p=au.play();
      if(p&&p.then){p.catch(function(){au.muted=true;var q=au.play();if(q&&q.then)q.catch(function(){});document.addEventListener('pointerdown',un);document.addEventListener('touchstart',un);});}
    }
