    <script>
    (function(){
      var now=new Date();
      var fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Asia/Shanghai',hour:'numeric',hour12:false});
      var h=parseInt(fmt.format(now),10)%24;
      if(h>=23||h<6){
        document.querySelectorAll('script[type="module"]').forEach(function(s){s.remove();});
        window.__NS=true;
      }
    })();
    </script>
    <script>
    (function(){
      if(window.__NS) return;
      function prep(img){
        if(img.hasAttribute('loading')||img.dataset.ld) return;
        img.dataset.ld='1';
        img.setAttribute('loading','lazy');
        img.setAttribute('decoding','async');
      }
      new MutationObserver(function(muts){
        for(const m of muts){
          for(const n of m.addedNodes){
            if(n.nodeType!==1) continue;
            if(n.tagName==='IMG') prep(n);
            else if(n.querySelectorAll) n.querySelectorAll('img').forEach(prep);
          }
        }
      }).observe(document.documentElement,{childList:true,subtree:true});
    })();
    </script>

  <body>
    <script>
    if(window.__NS){
      document.title='夜间关闭 · 八年级14班';
      document.write('<div style="position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99999;background:#1a1a2e;color:#F7F4ED;font-family:Georgia,serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:2rem"><div style="max-width:480px"><div style="width:80px;height:80px;margin:0 auto 1.5rem;border:3px solid #B23A2E;border-radius:50%;display:flex;align-items:center;justify-content:center"><span style="font-size:2.4rem;color:#B23A2E;line-height:1">月</span></div><h1 style="font-size:1.6rem;color:#B23A2E;margin-bottom:1rem;letter-spacing:.1em">夜间关闭中</h1><p style="font-size:1.05rem;line-height:1.9;color:#bbb">八年级14班班级文化网站<br>已进入夜间休息时间</p><p style="margin-top:.5rem;font-size:1.05rem;line-height:1.9;color:#bbb">请在每天 06:00 后再来访问</p><div style="margin-top:1.5rem;font-size:.85rem;color:#666;border-top:1px solid #333;padding-top:1rem">关闭时段 23:00 — 06:00（北京时间）</div></div></div>');
    }
    </script>
    <div id="app"></div>
    <script>
    if(!window.__NS){
      var SG=[{n:'心似烟火',s:'心似烟火.mp3'},{n:'星茶会',s:'星茶会.mp3'},{n:'风摇盛夏',s:'风摇盛夏.mp3'},{n:'3:30PM',s:'3_30PM.mp3'}];
      var ci=0,au=new Audio();au.preload='metadata';
      var css='#mp{position:fixed;right:16px;bottom:16px;z-index:99998;display:flex;align-items:center;gap:10px;background:rgba(247,244,237,.96);border:1px solid rgba(178,58,46,.25);border-radius:30px;padding:6px 10px 6px 16px;box-shadow:0 6px 24px rgba(0,0,0,.14);font-family:Georgia,serif;user-select:none}';
      css+='#mp .nm{font-size:13px;color:#B23A2E;cursor:pointer;max-width:96px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}';
      css+='#mp .pg{width:64px;height:3px;background:rgba(178,58,46,.18);border-radius:2px;overflow:hidden}';
      css+='#mp .pb{height:100%;width:0;background:#B23A2E;transition:width .1s}';
      css+='#mp .bt{width:30px;height:30px;border-radius:50%;background:#B23A2E;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;flex-shrink:0;transition:.15s}';
      css+='#mp .bt:hover{background:#9c4535}';
      css+='#mp .bt:active{transform:scale(.92)}';
      var st=document.createElement('style');st.textContent=css;document.head.appendChild(st);
      var mp=document.createElement('div');mp.id='mp';
      mp.innerHTML='<span class="nm"></span><div class="pg"><div class="pb"></div></div><span class="bt bt-play">&#9654;</span><span class="bt bt-next">&#9194;</span>';
      document.body.appendChild(mp);
      var nmEl=mp.querySelector('.nm'),pbEl=mp.querySelector('.pb'),playEl=mp.querySelector('.bt-play'),nextEl=mp.querySelector('.bt-next');
      function load(){au.src='/music/'+encodeURIComponent(SG[ci].s);nmEl.textContent=SG[ci].n;}
      function play(){au.play();}
      function toggle(){if(au.paused)play();else au.pause();}
      function next(){var wp=!au.paused;ci=(ci+1)%SG.length;load();if(wp)play();}
      playEl.addEventListener('click',function(e){e.stopPropagation();toggle();});
      nextEl.addEventListener('click',function(e){e.stopPropagation();next();});
      nmEl.addEventListener('click',function(){next();});
      au.addEventListener('timeupdate',function(){if(au.duration)pbEl.style.width=(au.currentTime/au.duration*100)+'%';});
      au.addEventListener('ended',function(){next();});
      au.addEventListener('play',function(){playEl.innerHTML='&#10074;&#10074;';});
      au.addEventListener('pause',function(){playEl.innerHTML='&#9654;';});
      load();
    }
    </script>
  </body>
