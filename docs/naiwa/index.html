<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>奶蛙跑酷 · Naiwa Run</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#aee1f9;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;user-select:none}
#wrap{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
#game{display:block;max-width:100%;max-height:100%;background:#aee1f9;border-radius:0;box-shadow:0 8px 40px rgba(0,0,0,.25)}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.overlay .card{background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border-radius:24px;padding:28px 36px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.18);pointer-events:auto;max-width:90%}
.overlay h1{font-size:30px;color:#5a8d3a;letter-spacing:2px;margin-bottom:6px}
.overlay .sub{font-size:14px;color:#8a9a7a;margin-bottom:20px}
.overlay .scorebig{font-size:54px;font-weight:800;color:#ffb84d;text-shadow:0 3px 0 #d99a30;line-height:1;margin:8px 0}
.overlay .best{font-size:13px;color:#a0a890;margin-top:8px}
.btn{display:inline-block;margin-top:16px;padding:12px 34px;background:linear-gradient(135deg,#8ed16f,#6cb84a);color:#fff;border:none;border-radius:30px;font-size:17px;font-weight:600;cursor:pointer;box-shadow:0 6px 0 #4f8d35,0 8px 18px rgba(0,0,0,.15);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #4f8d35,0 4px 10px rgba(0,0,0,.15)}
.btn.alt{background:linear-gradient(135deg,#ffc56b,#ff9d3a);box-shadow:0 6px 0 #d97a1f,0 8px 18px rgba(0,0,0,.15)}
.btn.alt:active{box-shadow:0 2px 0 #d97a1f,0 4px 10px rgba(0,0,0,.15)}
.tip{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.3);pointer-events:none}
.hud{position:absolute;top:14px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}
.hud .chip{background:rgba(255,255,255,.85);border-radius:16px;padding:6px 14px;font-size:15px;font-weight:700;color:#5a8d3a;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.hud .chip.best{color:#ff9d3a}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="hud hidden" id="hud">
    <div class="chip" id="scoreChip">0</div>
    <div class="chip best" id="bestChip">最佳 0</div>
  </div>
  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>奶蛙跑酷</h1>
      <div class="sub">小奶蛙一路向前，跳过障碍，收集萤火虫</div>
      <button class="btn" id="startBtn">开始奔跑</button>
      <div class="best" id="startBest">最佳成绩 0</div>
    </div>
  </div>
  <div class="overlay hidden" id="overScreen">
    <div class="card">
      <h1>哎呀摔啦</h1>
      <div class="scorebig" id="overScore">0</div>
      <div class="sub" id="overTip">再来一次？</div>
      <button class="btn alt" id="retryBtn">再来一次</button>
      <div class="best" id="overBest">最佳成绩 0</div>
    </div>
  </div>
  <div class="tip hidden" id="tip">点击 / 空格 跳跃 · 双击二段跳</div>
</div>
<script>
(function(){
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const wrap=document.getElementById('wrap');
const startScreen=document.getElementById('startScreen');
const overScreen=document.getElementById('overScreen');
const startBtn=document.getElementById('startBtn');
const retryBtn=document.getElementById('retryBtn');
const scoreChip=document.getElementById('scoreChip');
const bestChip=document.getElementById('bestChip');
const startBest=document.getElementById('startBest');
const overScore=document.getElementById('overScore');
const overBest=document.getElementById('overBest');
const overTip=document.getElementById('overTip');
const tip=document.getElementById('tip');
const hud=document.getElementById('hud');

let W=960,H=540,GND;
function resize(){
  const r=wrap.getBoundingClientRect();
  const ratio=16/9;
  let w=r.width,h=r.height;
  if(w/h>ratio) w=h*ratio; else h=w/ratio;
  cv.width=W=960;cv.height=H=540;
  cv.style.width=w+'px';cv.style.height=h+'px';
  GND=H-90;
}
window.addEventListener('resize',resize);resize();

const STATE={READY:0,PLAY:1,OVER:2};
let state=STATE.READY;
let score=0,best=+(localStorage.getItem('naiwa_best')||0);
let speed=5,baseSpeed=5,t=0;
let shake=0;

const frog={
  x:160,y:0,vy:0,w:54,h:44,
  onGround:true,jumps:0,legPhase:0,blink:0,blinkT:120,squash:1,
};
function resetFrog(){frog.y=GND-frog.h;frog.vy=0;frog.onGround=true;frog.jumps=0;frog.squash=1;}

const GRAV=0.62,JUMP=-13.5,JUMP2=-11.5;
const obstacles=[],collects=[],particles=[],clouds=[],hills=[];
let obsTimer=0,colTimer=0;

for(let i=0;i<6;i++)clouds.push({x:Math.random()*W,y:30+Math.random()*120,s:0.5+Math.random()*0.7,sp:0.3+Math.random()*0.4});
for(let i=0;i<5;i++)hills.push({x:i*260-100,h:60+Math.random()*50,c:i%2});

function spawnObstacle(){
  const r=Math.random();
  if(r<0.45){
    obstacles.push({type:'rock',x:W+40,y:GND-26,w:42,h:32});
  }else if(r<0.78){
    obstacles.push({type:'spike',x:W+40,y:GND-30,w:38,h:30});
  }else{
    obstacles.push({type:'log',x:W+40,y:GND-22,w:70,h:24});
  }
}
function spawnCollect(){
  const y=GND-60-Math.random()*140;
  collects.push({type:'fly',x:W+40,y:y,r:9,phase:Math.random()*6.28});
}
function spawnBerry(){
  collects.push({type:'berry',x:W+40,y:GND-50-Math.random()*100,r:10});
}

function jump(){
  if(state!==STATE.PLAY)return;
  if(frog.onGround){
    frog.vy=JUMP;frog.onGround=false;frog.jumps=1;frog.squash=1.3;
    dust(frog.x,GND,6);
    beep(520,0.06,'square',0.04);
  }else if(frog.jumps<2){
    frog.vy=JUMP2;frog.jumps=2;frog.squash=1.25;
    dust(frog.x,frog.y+frog.h,4);
    beep(680,0.06,'square',0.04);
  }
}

function dust(x,y,n){for(let i=0;i<n;i++)particles.push({x,y,vx:-1-Math.random()*2,vy:-1-Math.random()*1.5,life:24,max:24,c:'#e8f0d8',r:2+Math.random()*2});}
function sparkle(x,y,n,c){for(let i=0;i<n;i++){const a=Math.random()*6.28;const s=1+Math.random()*3;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,life:30,max:30,c:c||'#fff4a0',r:2+Math.random()*2});}}

let actx;
function beep(freq,dur,type,vol){
  try{
    if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||'sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol||0.05,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,actx.currentTime+dur);
    o.connect(g);g.connect(actx.destination);
    o.start();o.stop(actx.currentTime+dur);
  }catch(e){}
}

function start(){
  state=STATE.PLAY;
  startScreen.classList.add('hidden');
  overScreen.classList.add('hidden');
  hud.classList.remove('hidden');
  tip.classList.remove('hidden');
  score=0;speed=baseSpeed;t=0;
  obstacles.length=0;collects.length=0;particles.length=0;
  obsTimer=60;colTimer=90;
  resetFrog();
  if(actx&&actx.state==='suspended')actx.resume();
  setTimeout(()=>tip.classList.add('hidden'),3000);
}
function gameOver(){
  state=STATE.OVER;
  shake=14;
  beep(180,0.18,'sawtooth',0.06);
  setTimeout(()=>beep(120,0.25,'sawtooth',0.05),120);
  if(Math.floor(score)>best){best=Math.floor(score);localStorage.setItem('naiwa_best',best);}
  overScore.textContent=Math.floor(score);
  overBest.textContent='最佳成绩 '+best;
  overTip.textContent=Math.floor(score)>best-1&&best>0?'刷新纪录！':'再来一次？';
  overScreen.classList.remove('hidden');
  hud.classList.add('hidden');
}

function update(){
  t++;
  score+=0.12+speed*0.008;
  scoreChip.textContent=Math.floor(score);
  bestChip.textContent='最佳 '+Math.max(best,Math.floor(score));

  speed=baseSpeed+Math.min(6,t*0.0008);

  frog.vy+=GRAV;
  frog.y+=frog.vy;
  if(frog.y>=GND-frog.h){
    frog.y=GND-frog.h;frog.vy=0;
    if(!frog.onGround){frog.onGround=true;frog.jumps=0;frog.squash=0.7;dust(frog.x,GND,4);}
  }
  frog.squash+=(1-frog.squash)*0.2;
  frog.legPhase+=0.3;
  frog.blinkT--;if(frog.blinkT<=0){frog.blink=6;frog.blinkT=80+Math.random()*120;}
  if(frog.blink>0)frog.blink--;

  obsTimer--;if(obsTimer<=0){spawnObstacle();obsTimer=Math.max(45,90-speed*4+Math.random()*40);}
  colTimer--;if(colTimer<=0){if(Math.random()<0.25)spawnBerry();else spawnCollect();colTimer=70+Math.random()*60;}

  for(let i=obstacles.length-1;i>=0;i--){
    const o=obstacles[i];o.x-=speed;
    if(o.x+o.w<-20)obstacles.splice(i,1);
    else if(aabb(frog,o)){gameOver();return;}
  }
  for(let i=collects.length-1;i>=0;i--){
    const c=collects[i];c.x-=speed;
    if(c.type==='fly')c.y+=Math.sin(t*0.08+c.phase)*0.8;
    if(c.x<-30){collects.splice(i,1);continue;}
    if(circleHit(frog,c)){
      if(c.type==='berry'){score+=50;sparkle(c.x,c.y,10,'#ff6b6b');beep(880,0.08,'square',0.05);}
      else{score+=10;sparkle(c.x,c.y,8,'#fff4a0');beep(740,0.05,'sine',0.04);}
      collects.splice(i,1);
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.vy+=0.12;p.life--;
    if(p.life<=0)particles.splice(i,1);
  }
  for(const cl of clouds){cl.x-=cl.sp;if(cl.x<-80){cl.x=W+80;cl.y=30+Math.random()*120;cl.s=0.5+Math.random()*0.7;}}
  if(shake>0)shake*=0.85;
}

function aabb(a,b){
  const ax=a.x+6,ay=a.y+6,aw=a.w-12,ah=a.h-12;
  const bx=b.x+4,by=b.y+4,bw=b.w-8,bh=b.h-8;
  return ax<bx+bw&&ax+aw>bx&&ay<by+bh&&ay+ah>by;
}
function circleHit(f,c){
  const fx=f.x+f.w/2,fy=f.y+f.h/2;
  const dx=fx-c.x,dy=fy-c.y;
  return dx*dx+dy*dy<(c.r+f.w*0.4)*(c.r+f.w*0.4);
}

function drawBg(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#bfe8f7');g.addColorStop(0.6,'#d9f0c8');g.addColorStop(1,'#a8d878');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  for(const h of hills){
    ctx.fillStyle=h.c?'rgba(120,180,90,.35)':'rgba(140,200,110,.25)';
    ctx.beginPath();
    ctx.moveTo(h.x,GND);
    ctx.quadraticCurveTo(h.x+120,GND-h.h,h.x+240,GND);
    ctx.lineTo(h.x,GND);ctx.fill();
    h.x-=speed*0.15;if(h.x<-240)h.x+=260*5;
  }
  for(const cl of clouds){
    ctx.fillStyle='rgba(255,255,255,.85)';
    const s=cl.s;
    ctx.beginPath();
    ctx.arc(cl.x,cl.y,22*s,0,6.28);
    ctx.arc(cl.x+22*s,cl.y+4*s,18*s,0,6.28);
    ctx.arc(cl.x-20*s,cl.y+6*s,16*s,0,6.28);
    ctx.arc(cl.x+6*s,cl.y-10*s,16*s,0,6.28);
    ctx.fill();
  }
}
function drawGround(){
  ctx.fillStyle='#7cc16a';ctx.fillRect(0,GND,W,H-GND);
  ctx.fillStyle='#6ab058';ctx.fillRect(0,GND,W,8);
  ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=2;
  for(let x=-(t*speed%40);x<W;x+=40){ctx.beginPath();ctx.moveTo(x,GND+14);ctx.lineTo(x+20,GND+26);ctx.stroke();}
  ctx.fillStyle='rgba(110,170,80,.5)';
  for(let x=-(t*speed%60);x<W;x+=60){ctx.fillRect(x+2,GND+2,3,5);ctx.fillRect(x+10,GND+1,3,6);}
}
function drawFrog(){
  const sq=frog.squash;
  const bw=frog.w/Math.sqrt(sq),bh=frog.h*sq;
  const cx=frog.x+frog.w/2,cy=frog.y+bh/2;
  ctx.save();
  ctx.translate(cx,cy);
  const legSwing=Math.sin(frog.legPhase)*4;
  if(!frog.onGround){
    ctx.fillStyle='#9cc980';
    ctx.beginPath();ctx.ellipse(-bw*0.3,bh*0.3,8,5,-0.3,0,6.28);ctx.fill();
    ctx.beginPath();ctx.ellipse(bw*0.3,bh*0.3,8,5,0.3,0,6.28);ctx.fill();
  }else{
    ctx.fillStyle='#9cc980';
    ctx.beginPath();ctx.ellipse(-bw*0.32,bh*0.42+legSwing*0.3,9,5,0,0,6.28);ctx.fill();
    ctx.beginPath();ctx.ellipse(bw*0.32,bh*0.42-legSwing*0.3,9,5,0,0,6.28);ctx.fill();
  }
  ctx.fillStyle='#fff6e0';
  ctx.beginPath();ctx.ellipse(0,0,bw/2,bh/2,0,0,6.28);ctx.fill();
  ctx.fillStyle='#c8e8a0';
  ctx.beginPath();ctx.arc(-bw*0.22,bh*0.15,5,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(bw*0.18,bh*0.22,4,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(bw*0.28,-bh*0.1,3,0,6.28);ctx.fill();
  const eyeY=-bh*0.35;
  const eyeR=10;
  ctx.fillStyle='#fff';
  ctx.beginPath();ctx.arc(-bw*0.22,eyeY,eyeR,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(bw*0.22,eyeY,eyeR,0,6.28);ctx.fill();
  if(frog.blink>0){
    ctx.strokeStyle='#5a8d3a';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-bw*0.22-6,eyeY);ctx.lineTo(-bw*0.22+6,eyeY);ctx.stroke();
    ctx.beginPath();ctx.moveTo(bw*0.22-6,eyeY);ctx.lineTo(bw*0.22+6,eyeY);ctx.stroke();
  }else{
    ctx.fillStyle='#1a1a1a';
    ctx.beginPath();ctx.arc(-bw*0.2,eyeY+1,4,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(bw*0.24,eyeY+1,4,0,6.28);ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(-bw*0.19,eyeY-1,1.5,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(bw*0.25,eyeY-1,1.5,0,6.28);ctx.fill();
  }
  ctx.fillStyle='#ffb6c1';ctx.globalAlpha=0.6;
  ctx.beginPath();ctx.arc(-bw*0.32,bh*0.05,5,0,6.28);ctx.fill();
  ctx.beginPath();ctx.arc(bw*0.32,bh*0.05,5,0,6.28);ctx.fill();
  ctx.globalAlpha=1;
  ctx.strokeStyle='#5a8d3a';ctx.lineWidth=2;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,bh*0.05,7,0.2,Math.PI-0.2);ctx.stroke();
  ctx.restore();
}
function drawObstacle(o){
  if(o.type==='rock'){
    ctx.fillStyle='#9a8c7a';
    roundRect(o.x,o.y,o.w,o.h,8);ctx.fill();
    ctx.fillStyle='#847466';
    roundRect(o.x+6,o.y+8,o.w-12,o.h-14,6);ctx.fill();
    ctx.fillStyle='#b5a896';ctx.beginPath();ctx.arc(o.x+12,o.y+10,4,0,6.28);ctx.fill();
  }else if(o.type==='spike'){
    ctx.fillStyle='#c04040';
    ctx.beginPath();
    ctx.moveTo(o.x,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y);ctx.lineTo(o.x+o.w,o.y+o.h);
    ctx.closePath();ctx.fill();
    ctx.fillStyle='#e07070';
    ctx.beginPath();
    ctx.moveTo(o.x+4,o.y+o.h);ctx.lineTo(o.x+o.w/2,o.y+8);ctx.lineTo(o.x+o.w-4,o.y+o.h);
    ctx.closePath();ctx.fill();
  }else{
    ctx.fillStyle='#b89060';
    roundRect(o.x,o.y,o.w,o.h,8);ctx.fill();
    ctx.strokeStyle='#8a6a40';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(o.x+8,o.y+o.h/2);ctx.lineTo(o.x+o.w-8,o.y+o.h/2);ctx.stroke();
    ctx.fillStyle='#8a6a40';ctx.beginPath();ctx.arc(o.x+6,o.y+o.h/2,3,0,6.28);ctx.fill();
    ctx.beginPath();ctx.arc(o.x+o.w-6,o.y+o.h/2,3,0,6.28);ctx.fill();
  }
}
function drawCollect(c){
  if(c.type==='fly'){
    const glow=ctx.createRadialGradient(c.x,c.y,2,c.x,c.y,c.r*2.2);
    glow.addColorStop(0,'rgba(255,240,140,.7)');glow.addColorStop(1,'rgba(255,240,140,0)');
    ctx.fillStyle=glow;ctx.beginPath();ctx.arc(c.x,c.y,c.r*2.2,0,6.28);ctx.fill();
    ctx.fillStyle='#fff4a0';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,6.28);ctx.fill();
    ctx.fillStyle='#fffbe0';ctx.beginPath();ctx.arc(c.x-2,c.y-2,c.r*0.4,0,6.28);ctx.fill();
    const w=Math.sin(t*0.5)*4;
    ctx.strokeStyle='rgba(180,180,120,.5)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(c.x-c.r,c.y);ctx.lineTo(c.x-c.r-6,c.y+w);ctx.stroke();
    ctx.beginPath();ctx.moveTo(c.x+c.r,c.y);ctx.lineTo(c.x+c.r+6,c.y-w);ctx.stroke();
  }else{
    ctx.fillStyle='#e84545';ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,6.28);ctx.fill();
    ctx.fillStyle='#ff7878';ctx.beginPath();ctx.arc(c.x-3,c.y-3,c.r*0.4,0,6.28);ctx.fill();
    ctx.strokeStyle='#4a8a30';ctx.lineWidth=2;ctx.lineCap='round';
    ctx.beginPath();ctx.moveTo(c.x,c.y-c.r);ctx.lineTo(c.x+4,c.y-c.r-5);ctx.stroke();
    ctx.fillStyle='#4a8a30';ctx.beginPath();ctx.ellipse(c.x+4,c.y-c.r-3,3,1.5,-0.5,0,6.28);ctx.fill();
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha=p.life/p.max;
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,6.28);ctx.fill();
  }
  ctx.globalAlpha=1;
}
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function render(){
  ctx.save();
  if(shake>0.5){ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);}
  drawBg();drawGround();
  for(const c of collects)drawCollect(c);
  for(const o of obstacles)drawObstacle(o);
  drawFrog();
  drawParticles();
  ctx.restore();
}

function loop(){
  if(state===STATE.PLAY)update();
  render();
  requestAnimationFrame(loop);
}

startBest.textContent='最佳成绩 '+best;
overBest.textContent='最佳成绩 '+best;

startBtn.addEventListener('click',start);
retryBtn.addEventListener('click',start);
window.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(state===STATE.READY)start();
    else if(state===STATE.OVER)start();
    else jump();
  }
});
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  if(state===STATE.PLAY)jump();
  else if(state===STATE.READY||state===STATE.OVER)start();
});

resetFrog();
loop();
})();
</script>
</body>
</html>
